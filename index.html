<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Русский и котики</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Макет: две округлые «таблетки» в шапке (логотип и меню), под ними большой бордовый блок с заголовком-наклейкой, ниже кремовая страница с карточками. */
:root {
  --bg: #fbf6f2;        /* кремовый фон страницы */
  --burgundy: #93051f;  /* основной бордовый */
  --plum: #522e38;      /* тёмная слива: заголовки и вторая кнопка */
  --paper: #ffffff;     /* карточки и обводка заголовка */
  --line: #ddd3ce;      /* тонкие границы */
  --ink: #522e38;       /* основной текст */
  --ink-soft: #856b72;  /* вторичный текст */

  --font: "Comfortaa", "Nunito", "Trebuchet MS", system-ui, sans-serif;

  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  font-weight: 400;
  line-height: 1.55;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--burgundy); outline-offset: 3px; border-radius: 12px; }

.wrap { width: 100%; max-width: 1040px; margin-inline: auto; padding-inline: 20px; }

/* ---------- шапка ---------- */
.topbar { padding-block: 14px 0; }
.topbar .wrap { display: flex; gap: 14px; align-items: stretch; flex-wrap: wrap; }
.pill {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--line); border-radius: 32px; padding: 14px 28px;
}
.brand { text-decoration: none; padding-inline: 26px 34px; }
.brand img { width: 78px; height: auto; display: block; flex: none; }
.brand span {
  font-weight: 700; font-size: 1.55rem; line-height: 1.02; color: var(--burgundy);
  text-transform: uppercase; letter-spacing: .01em;
}
.nav { margin-left: auto; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 11px 22px; border-radius: 16px; border: 0; cursor: pointer;
  font: 500 1rem var(--font); text-decoration: none; text-align: center;
  background: var(--burgundy); color: #fff; transition: transform .15s, filter .15s;
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
.btn.plum { background: var(--plum); }
.btn svg { width: 18px; height: 18px; flex: none; }

/* ---------- бордовый блок ---------- */
main { flex: 1; padding-block: 20px 72px; }
.hero {
  position: relative; overflow: hidden;
  background: var(--burgundy); color: #fff; border-radius: 32px;
  padding: 44px clamp(24px, 5vw, 56px) 48px; margin-bottom: 44px;
}
.hero::after { /* тонкие светлые линии, как на вашем сайте */
  content: ""; position: absolute; right: 6%; top: 0; bottom: 0; width: 140px; pointer-events: none;
  background:
    linear-gradient(90deg, transparent 48%, rgba(255,255,255,.22) 48.5%, rgba(255,255,255,.22) 50%, transparent 50.5%) 0 0 / 100% 100% no-repeat,
    linear-gradient(0deg, transparent 38%, rgba(255,255,255,.18) 38.5%, rgba(255,255,255,.18) 39.5%, transparent 40%) 0 0 / 100% 100% no-repeat;
  transform: rotate(4deg);
}
.hero > * { position: relative; z-index: 1; }
.eyebrow { font-weight: 700; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 18px; opacity: .9; }

/* заголовок-наклейка: сливовые буквы с белой обводкой */
.sticker {
  display: inline-block; margin: 0 0 22px; max-width: 100%;
  font-weight: 700; text-transform: uppercase; line-height: 1.12;
  font-size: clamp(2rem, 7vw, 4.2rem);
  color: var(--plum);
  -webkit-text-stroke: .2em var(--paper); paint-order: stroke fill;
  text-shadow: 0 0 0 var(--paper);
  transform: rotate(-1.2deg);
  text-wrap: balance; overflow-wrap: anywhere;
}
.hero .lead { margin: 0; max-width: 34rem; font-size: 1.05rem; text-transform: lowercase; }

.section-title { font-weight: 700; font-size: 1.5rem; margin: 0 0 20px; text-transform: lowercase; }

/* ---------- карточки разделов ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; list-style: none; margin: 0; padding: 0; }
.card {
  display: flex; flex-direction: column; justify-content: space-between; gap: 30px;
  min-height: 200px; padding: 24px; height: 100%;
  background: var(--paper); border: 1px solid var(--line); border-radius: 28px;
  text-decoration: none; transition: border-color .18s, transform .18s, box-shadow .18s;
}
.card:hover { border-color: var(--burgundy); transform: translateY(-3px); box-shadow: 0 10px 24px -14px rgba(147,5,31,.45); }
.card .tag { font-weight: 700; font-size: 2.4rem; line-height: 1; color: var(--burgundy); text-transform: uppercase; }
.card .name { font-weight: 700; font-size: 1.1rem; line-height: 1.3; margin: 0 0 8px; }
.card .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--ink-soft); font-size: .86rem; }
.card .arrow { color: var(--burgundy); font-size: 1.3rem; transition: transform .18s; flex: none; }
.card:hover .arrow { transform: translateX(4px); }

/* ---------- страница урока ---------- */
.back { margin-bottom: 22px; padding: 9px 20px; border-radius: 999px; font-size: .95rem; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.55); }
.back:hover { background: rgba(255,255,255,.22); filter: none; }

.block { margin-bottom: 40px; }
.block h2 { font-weight: 700; font-size: 1.5rem; margin: 0 0 6px; text-transform: lowercase; }
.block .hint { color: var(--ink-soft); margin: 0 0 18px; font-size: .95rem; max-width: 40rem; }

.video { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--plum); border-radius: 28px; overflow: hidden; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; color: #f1dfe2; }
.video .empty img { width: 92px; height: auto; }
.video .empty strong { color: #fff; font-weight: 700; font-size: 1.1rem; }

.files { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.file {
  display: flex; flex-direction: column; gap: 4px; min-width: 0;
  padding: 22px 24px; background: var(--paper); border: 1px solid var(--line); border-radius: 28px;
}
.file .kind { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
.file .title { font-weight: 700; font-size: 1.1rem; line-height: 1.3; }
.file .info { color: var(--ink-soft); font-size: .85rem; margin-bottom: 16px; }
.file .btn { align-self: flex-start; margin-top: auto; }
.file.soon { border-style: dashed; background: transparent; }
.file.soon .btn { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); cursor: default; pointer-events: none; }

footer { color: var(--ink-soft); font-size: .88rem; }
footer .wrap { padding-block: 22px 28px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); }
footer img { width: 34px; height: auto; }

[hidden] { display: none !important; }

@media (max-width: 720px) {
  .pill { padding: 12px 20px; }
  .brand { padding-inline: 18px; }
  .brand img { width: 58px; }
  .brand span { font-size: 1.2rem; }
  .nav { margin-left: 0; }
  .hero { padding-block: 30px 34px; border-radius: 26px; }
  main { padding-block: 16px 52px; }
}
@media (max-width: 440px) {
  .topbar .wrap { gap: 10px; }
  .topbar .wrap > .pill { flex: 1 1 100%; justify-content: center; }
  .nav { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

document.querySelectorAll("img.logo").forEach(function (img) { img.src = LOGO; });
document.getElementById("favicon").href = LOGO;

const app = document.getElementById("app");

const ICON_DOWNLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>';

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function extOf(path) {
  const m = String(path).match(/\.([A-Za-z0-9]+)$/);
  return m ? m[1].toUpperCase() : "";
}

function lessonParts(l) {
  const parts = [];
  if (l.kinescope !== null) parts.push("видео");
  l.groups.forEach(function (g) { parts.push(g.title.toLowerCase()); });
  return parts.join(" · ");
}

function renderHome() {
  document.title = SITE_NAME;
  const cards = LESSONS.map(function (l) {
    return '<li><a class="card" href="#/' + esc(l.slug) + '">' +
      '<span class="tag">' + esc(l.tag) + '</span>' +
      '<span><p class="name">' + esc(l.title) + '</p>' +
      '<span class="meta"><span>' + esc(lessonParts(l)) + '</span><span class="arrow" aria-hidden="true">→</span></span></span>' +
      '</a></li>';
  }).join("");

  app.innerHTML =
    '<section class="hero">' +
      '<p class="eyebrow">Годовой курс 26/27</p>' +
      '<h1 class="sticker">Материалы уроков</h1>' +
      '<p class="lead">Выберите урок: видеолекция, тетради и домашнее задание в одном месте.</p>' +
    '</section>' +
    '<h2 class="section-title">разделы</h2>' +
    '<ul class="grid">' + cards + '</ul>';
}

function kinescopeSrc(v) {
  v = String(v).trim();
  const m = v.match(/kinescope\.io\/(?:embed\/)?([A-Za-z0-9_-]+)/);
  return "https://kinescope.io/embed/" + (m ? m[1] : v);
}

function fileCard(l, f) {
  const ext = extOf(f.path);
  if (!f.path) {
    return '<div class="file soon"><span class="kind">Файл</span>' +
      '<span class="title">' + esc(f.title) + '</span><span class="info">&nbsp;</span>' +
      '<span class="btn">Скоро появится</span></div>';
  }
  const saveAs = l.title + " — " + f.title + (ext ? "." + ext.toLowerCase() : "");
  const info = ext + (f.size ? " · " + f.size : "");
  return '<div class="file"><span class="kind">' + esc(ext === "DOCX" ? "Word" : "PDF") + '</span>' +
    '<span class="title">' + esc(f.title) + '</span>' +
    '<span class="info">' + esc(info) + '</span>' +
    '<a class="btn" href="' + esc(f.path) + '" download="' + esc(saveAs) + '">' + ICON_DOWNLOAD + 'скачать</a></div>';
}

function renderLesson(l) {
  document.title = l.title + " · " + SITE_NAME;
  let videoBlock = "";
  if (l.kinescope !== null) {
    const inner = l.kinescope
      ? '<iframe src="' + esc(kinescopeSrc(l.kinescope)) + '" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer; clipboard-write;" allowfullscreen title="Видеолекция: ' + esc(l.title) + '"></iframe>'
      : '<div class="empty"><img alt="" src="' + LOGO + '"><strong>Видео скоро появится</strong><span>Лекция загружается, загляните чуть позже.</span></div>';
    videoBlock = '<section class="block"><h2>видеолекция</h2>' +
      '<p class="hint">Смотрите прямо на странице.</p><div class="video">' + inner + '</div></section>';
  }

  const groups = l.groups.map(function (g) {
    return '<section class="block"><h2>' + esc(g.title) + '</h2>' +
      (g.hint ? '<p class="hint">' + esc(g.hint) + '</p>' : '') +
      '<div class="files">' + g.files.map(function (f) { return fileCard(l, f); }).join("") + '</div></section>';
  }).join("");

  app.innerHTML =
    '<section class="hero">' +
      '<a class="btn back" href="#/"><span aria-hidden="true">←</span> все разделы</a>' +
      '<p class="eyebrow">Годовой курс 26/27</p>' +
      '<h1 class="sticker">' + esc(l.title) + '</h1>' +
    '</section>' + videoBlock + groups;
}

function route() {
  const slug = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const lesson = LESSONS.find(function (l) { return l.slug === slug; });
  if (lesson) renderLesson(lesson); else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
